name: Daily scrape + categorize

on:
  schedule:
    # 03:17 UTC every day (~05:17 Europe/Berlin in summer, 04:17 in winter).
    # Slightly off the hour to avoid kaufDA's load peaks.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "Limit keywords (empty = all)"
        required: false
        default: ""
      categorize:
        description: "Run LLM categorizer afterwards"
        required: false
        default: "true"

concurrency:
  # Only one scrape at a time. Skip overlapping runs rather than queueing.
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Server-side secrets — set in GitHub repo Settings → Secrets and variables → Actions
      SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:           ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BASE_URL:             ${{ secrets.GEMINI_BASE_URL }}
      TEXT_MODEL:                  ${{ secrets.TEXT_MODEL }}
      # Required by config.py at import time but unused in the scrape path.
      # Provide a dummy so the module loads; the actual bot stays on your machine.
      TELEGRAM_BOT_TOKEN:          "unused-in-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape kaufDA
        env:
          KEYWORDS_ARG:   ${{ github.event.inputs.keywords }}
          CATEGORIZE_ARG: ${{ github.event.inputs.categorize }}
        run: |
          ARGS=""
          if [ -n "$KEYWORDS_ARG" ]; then
            ARGS="$ARGS --keywords $KEYWORDS_ARG"
          fi
          # Default: yes-categorize on cron; respect input toggle on manual run.
          if [ "$CATEGORIZE_ARG" != "false" ]; then
            ARGS="$ARGS --categorize"
          fi
          python -m scripts.run_scrape $ARGS
